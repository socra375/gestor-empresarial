name: Copia de seguridad nocturna

# Copia de la base de datos (esquemas public y auth) todas las noches.
# Supabase gratis no hace respaldos automáticos, así que se guarda aquí.
#
# La copia se CIFRA antes de subirla: en un repo público cualquiera con
# cuenta de GitHub puede descargar los archivos de una corrida. Sin la
# frase de BACKUP_PASSPHRASE no se puede abrir.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     URI del "Session pooler" (Supabase → Connect), con
#                       la contraseña de la base; ej.
#                       postgresql://postgres.<ref>:<clave>@aws-0-us-east-1.pooler.supabase.com:5432/postgres
#   BACKUP_PASSPHRASE   Frase larga para cifrar. Guárdala fuera de GitHub:
#                       sin ella las copias no se pueden restaurar.
#
# Cómo restaurar: supabase/RESPALDOS.md
on:
  schedule:
    # 06:23 UTC = 2:23 a. m. en República Dominicana.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump cifrado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Verificar secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltan los secrets SUPABASE_DB_URL y/o BACKUP_PASSPHRASE (ver comentario al inicio de backup.yml)."
            exit 1
          fi

      - name: Volcar la base (pg_dump 17, igual que el servidor)
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" -e SUPABASE_DB_URL postgres:17 \
            sh -c 'pg_dump "$SUPABASE_DB_URL" --schema=public --schema=auth --no-owner --no-privileges --format=custom --file=/out/backup.dump'
          # Una copia sin tablas es un error, no un respaldo.
          TABLES=$(docker run --rm -v "$PWD/out:/out" postgres:17 pg_restore --list /out/backup.dump | grep -c ' TABLE DATA ' || true)
          echo "Tablas con datos en la copia: $TABLES"
          if [ "$TABLES" -lt 5 ]; then
            echo "::error::La copia tiene muy pocas tablas ($TABLES); se descarta."
            exit 1
          fi

      - name: Cifrar
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "out/gestor-${STAMP}.dump.gpg" out/backup.dump
          shred -u out/backup.dump
          ls -lh out/

      - name: Guardar la copia cifrada (14 días)
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ env.STAMP }}
          path: out/gestor-${{ env.STAMP }}.dump.gpg
          retention-days: 14
          if-no-files-found: error
